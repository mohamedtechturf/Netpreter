<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netpreter — Web Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-alt: #161e2a;
    --border: #232d3a;
    --text: #e6edf3;
    --muted: #8a97a8;
    --accent: #3fb950;
    --accent-dim: #1f6b32;
    --critical: #f85149;
    --high: #ff9e42;
    --medium: #e3c04d;
    --low: #58a6ff;
    --info: #8a97a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 14px;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
  header .sub { color: var(--muted); font-size: 12px; }

  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 16px;
    padding: 16px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 12px 0;
  }

  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], select {
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
  }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; }

  button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent-dim);
    color: #d8ffe0;
    border: 1px solid var(--accent);
    padding: 9px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: var(--accent); color: #04140a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #scanStatus { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 220px; }

  .history-list { max-height: 260px; overflow-y: auto; }
  .history-row {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 4px; border-bottom: 1px solid var(--border);
    cursor: pointer; font-size: 12px;
  }
  .history-row:hover { background: var(--panel-alt); }
  .history-row.active { background: var(--panel-alt); border-left: 2px solid var(--accent); }
  .history-row .target { color: var(--text); }
  .history-row .meta { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
  tr:hover td { background: var(--panel-alt); }

  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 3px;
    font-size: 11px; font-weight: 600; text-transform: uppercase;
  }
  .badge.Critical { background: rgba(248,81,73,0.15); color: var(--critical); }
  .badge.High { background: rgba(255,158,66,0.15); color: var(--high); }
  .badge.Medium { background: rgba(227,192,77,0.15); color: var(--medium); }
  .badge.Low { background: rgba(88,166,255,0.15); color: var(--low); }
  .badge.Info { background: rgba(138,151,168,0.15); color: var(--info); }

  .cve-tag {
    display: inline-block; margin: 2px 4px 0 0; padding: 1px 6px;
    border: 1px solid var(--border); border-radius: 3px; font-size: 11px; color: var(--muted);
  }
  .empty-state { color: var(--muted); padding: 20px 4px; text-align: center; }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; }
  .filters input, .filters select { width: auto; flex: 1; }
  .detail-meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <h1>NETPRETER</h1>
  <span class="sub">Network Security &amp; Configuration Audit — Web Dashboard</span>
</header>

<main>
  <!-- Left column: scan trigger + history -->
  <div>
    <div class="panel">
      <h2>Run Scan</h2>
      <label for="targetInput">Target (IP / hostname / CIDR)</label>
      <input id="targetInput" type="text" placeholder="127.0.0.1, 10.0.0.0/28, example.com">

      <label for="portsInput">Ports</label>
      <input id="portsInput" type="text" value="top" placeholder="top | 22,80,443 | 1-1024">

      <div class="row">
        <div>
          <label for="timeoutInput">Timeout (s)</label>
          <input id="timeoutInput" type="number" step="0.1" value="1.0">
        </div>
        <div>
          <label for="threadsInput">Threads</label>
          <input id="threadsInput" type="number" step="1" value="100">
        </div>
      </div>

      <div class="checkbox-row">
        <input id="bannerInput" type="checkbox" checked>
        <label for="bannerInput">Capture service banners</label>
      </div>

      <button id="scanBtn" onclick="triggerScan()">Run Audit</button>
      <div id="scanStatus"></div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <h2>Scan History</h2>
      <div id="historyList" class="history-list">
        <div class="empty-state">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Right column: charts + results -->
  <div>
    <div class="charts">
      <div class="panel">
        <h2>Severity Breakdown</h2>
        <div class="chart-box"><canvas id="severityChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>Open Ports Over Time</h2>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h2 style="display:flex; justify-content:space-between; align-items:baseline;">
        <span>Findings</span>
        <span id="detailMeta" class="detail-meta"></span>
      </h2>
      <div class="filters">
        <input id="searchInput" type="text" placeholder="Search service, port, remediation…" oninput="renderTable()">
        <select id="severityFilter" onchange="renderTable()">
          <option value="">All severities</option>
          <option value="Critical">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
          <option value="Info">Info</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Port</th><th>Service</th><th>Severity</th><th>Remediation</th><th>CVEs</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <tr><td colspan="5" class="empty-state">Select a scan from the history panel, or run a new one.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
const SEVERITY_ORDER = ["Critical", "High", "Medium", "Low", "Info"];
const SEVERITY_COLORS = {
  Critical: "#f85149", High: "#ff9e42", Medium: "#e3c04d", Low: "#58a6ff", Info: "#8a97a8"
};

let currentFindings = [];
let severityChart = null;
let trendChart = null;
let activeScanId = null;

function fmtDuration(sec) {
  return (Math.round(sec * 100) / 100) + "s";
}

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("Request failed: " + res.status));
  return data;
}

async function loadHistory() {
  const listEl = document.getElementById("historyList");
  try {
    const rows = await fetchJSON("/api/scans?limit=50");
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty-state">No scans yet — run one to get started.</div>';
      return;
    }
    listEl.innerHTML = rows.map(r => `
      <div class="history-row${r.id === activeScanId ? ' active' : ''}" onclick="loadScanDetail(${r.id})">
        <span class="target">#${r.id} ${r.target_ip}</span>
        <span class="meta">${r.open_port_count} open · ${fmtDuration(r.scan_duration || 0)}</span>
      </div>
    `).join("");
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state">Failed to load history: ${err.message}</div>`;
  }
}

async function loadScanDetail(scanId) {
  activeScanId = scanId;
  const metaEl = document.getElementById("detailMeta");
  try {
    const detail = await fetchJSON(`/api/scans/${scanId}`);
    currentFindings = detail.findings || [];
    metaEl.textContent = `Scan #${detail.id} · ${detail.target_ip} · ${detail.timestamp} · ${fmtDuration(detail.scan_duration || 0)}`;
    renderTable();
    renderSeverityChart(currentFindings);
    loadHistory(); // refresh highlight state
  } catch (err) {
    metaEl.textContent = `Failed to load scan: ${err.message}`;
  }
}

function renderTable() {
  const tbody = document.getElementById("resultsBody");
  const search = document.getElementById("searchInput").value.toLowerCase();
  const sevFilter = document.getElementById("severityFilter").value;

  let rows = currentFindings.filter(f => {
    if (sevFilter && f.severity !== sevFilter) return false;
    if (!search) return true;
    const haystack = `${f.port} ${f.service} ${f.remediation}`.toLowerCase();
    return haystack.includes(search);
  });

  rows.sort((a, b) => SEVERITY_ORDER.indexOf(a.severity) - SEVERITY_ORDER.indexOf(b.severity));

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No matching findings.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(f => `
    <tr>
      <td>${f.port}/tcp</td>
      <td>${f.service}${f.banner ? `<br><span style="color:var(--muted); font-size:11px;">${escapeHtml(f.banner)}</span>` : ""}</td>
      <td><span class="badge ${f.severity}">${f.severity}</span></td>
      <td>${escapeHtml(f.remediation)}</td>
      <td>${(f.cves || []).map(c => `<span class="cve-tag" title="${escapeHtml(c.summary)}">${c.cve_id} (${c.cvss_score})</span>`).join("") || "—"}</td>
    </tr>
  `).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function renderSeverityChart(findings) {
  const counts = { Critical: 0, High: 0, Medium: 0, Low: 0, Info: 0 };
  findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });

  const ctx = document.getElementById("severityChart");
  const data = {
    labels: SEVERITY_ORDER,
    datasets: [{
      data: SEVERITY_ORDER.map(s => counts[s]),
      backgroundColor: SEVERITY_ORDER.map(s => SEVERITY_COLORS[s]),
      borderColor: "#121821",
      borderWidth: 2,
    }]
  };
  if (severityChart) {
    severityChart.data = data;
    severityChart.update();
  } else {
    severityChart = new Chart(ctx, {
      type: "doughnut",
      data,
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { color: "#8a97a8", boxWidth: 10, font: { size: 10 } } } }
      }
    });
  }
}

async function loadTrendChart() {
  try {
    const stats = await fetchJSON("/api/stats");
    const recent = [...(stats.recent_scans || [])].reverse();
    const ctx = document.getElementById("trendChart");
    const data = {
      labels: recent.map(r => `#${r.id}`),
      datasets: [{
        label: "Open ports",
        data: recent.map(r => r.open_port_count),
        borderColor: "#3fb950",
        backgroundColor: "rgba(63,185,80,0.15)",
        tension: 0.25,
        fill: true,
        pointRadius: 3,
      }]
    };
    if (trendChart) {
      trendChart.data = data;
      trendChart.update();
    } else {
      trendChart = new Chart(ctx, {
        type: "line",
        data,
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: "#8a97a8", font: { size: 10 } }, grid: { color: "#232d3a" } },
            y: { beginAtZero: true, ticks: { color: "#8a97a8", stepSize: 1, font: { size: 10 } }, grid: { color: "#232d3a" } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }
  } catch (err) {
    console.error("Failed to load trend stats:", err);
  }
}

async function triggerScan() {
  const btn = document.getElementById("scanBtn");
  const statusEl = document.getElementById("scanStatus");
  const target = document.getElementById("targetInput").value.trim();
  if (!target) {
    statusEl.textContent = "Enter a target first.";
    return;
  }

  const payload = {
    target,
    ports: document.getElementById("portsInput").value.trim() || "top",
    timeout: parseFloat(document.getElementById("timeoutInput").value) || 1.0,
    threads: parseInt(document.getElementById("threadsInput").value, 10) || 100,
    banner: document.getElementById("bannerInput").checked,
  };

  btn.disabled = true;
  statusEl.textContent = "Queuing scan…";

  try {
    const queued = await fetchJSON("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    statusEl.textContent = "Scanning " + target + " …";
    await pollJob(queued.queue_id, statusEl);
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function pollJob(queueId, statusEl) {
  for (let i = 0; i < 300; i++) {
    const job = await fetchJSON(`/api/scan/${queueId}`);
    if (job.status === "done") {
      statusEl.textContent = "Scan complete.";
      await loadHistory();
      await loadTrendChart();
      if (job.scan_ids && job.scan_ids.length) {
        loadScanDetail(job.scan_ids[job.scan_ids.length - 1]);
      }
      return;
    }
    if (job.status === "error") {
      statusEl.textContent = "Scan failed: " + (job.error || "unknown error");
      return;
    }
    await sleep(1000);
  }
  statusEl.textContent = "Scan is taking a while — check history shortly.";
}

async function init() {
  await loadHistory();
  await loadTrendChart();
  renderSeverityChart([]);
}
init();
</script>
</body>
</html>
